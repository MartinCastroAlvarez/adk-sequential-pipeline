[tool.poetry]
name = "adk-sequential-pipeline"
version = "0.1.0"
description = "The sequential pipeline and generator-critic architecture in Google's Agent Development Kit: a content desk that turns a topic and a local source pack into a reviewed blog post. SequentialAgent[researcher, outliner, LoopAgent[writer, critic], fact-checker, editor], state handoff through output_key and {placeholder} instructions, guardrail callbacks, an ADK eval set. Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/adk-sequential-pipeline"
repository = "https://github.com/MartinCastroAlvarez/adk-sequential-pipeline"
documentation = "https://github.com/MartinCastroAlvarez/adk-sequential-pipeline#readme"
keywords = [
    "google-adk",
    "agent-development-kit",
    "ai-agents",
    "multi-agent",
    "sequential-agent",
    "loop-agent",
    "agent-critic",
    "guardrails",
    "ollama",
    "litellm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "content_desk" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
content-desk = "content_desk.cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
google-adk = ">=2.13,<3"
# The range google-adk[extensions] pins for its LiteLlm wrapper.
litellm = ">=1.84,<1.106.3"
pydantic = ">=2.12,<3"

[tool.poetry.group.dev.dependencies]
# ADK's eval tooling (AgentEvaluator, `adk eval`) lives behind the [eval] extra.
google-adk = { version = ">=2.13,<3", extras = ["eval"] }
pytest = "^9.0"
pytest-asyncio = ">=1.0,<2"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["content_desk", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=content_desk",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ADK 2.x marks SequentialAgent/LoopAgent deprecated in favour of graph Workflows.
    "ignore:.*(Sequential|Loop)Agent is deprecated:DeprecationWarning",
    # ADK's eval service labels its building blocks experimental.
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    # ...and its eval runner still passes Runner(plugins=...) internally.
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["content_desk"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = ["content_desk/__main__.py"]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
